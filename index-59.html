<header><h1>⚡ Bijli Manager <b>Pro</b></h1><button class="g" style="color:#fff;border-color:#ffffff55" onclick="cycleTheme()">Theme</button></header>
<div id="bkn"></div><main id="v"></main><nav id="nav"></nav><dialog id="dg"></dialog><div id="pr"></div>
<script>
const NAT=()=>{try{const C=window.Capacitor;return !!(window.androidBridge||(C&&((C.isNativePlatform&&C.isNativePlatform())||(C.getPlatform&&C.getPlatform()!=='web'))))}catch(x){return false}};
const CP=n=>{const C=window.Capacitor;if(C&&C.Plugins&&C.Plugins[n])return C.Plugins[n];if(C&&C.registerPlugin)return C.registerPlugin(n);throw new Error(n+' plugin not available')};
const b64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(b)});
const dbg=()=>{const C=window.Capacitor;return 'nat='+NAT()+' cap='+!!C+' bridge='+!!window.androidBridge+' plat='+(C&&C.getPlatform?C.getPlatform():'-')};
async function nativeShare(name,data,isText){const FS=CP('Filesystem'),SH=CP('Share');const o={path:name,data:data,directory:'CACHE'};if(isText)o.encoding='utf8';const w=await FS.writeFile(o);await SH.share({title:name,url:w.uri,dialogTitle:name})}

const K='bijli_pro_v1';let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(x){}
S=S||{meters:[],cycles:[],cur:'₹',theme:'auto'};
let _sf=0;const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));_sf=0;return 1}catch(x){if(!_sf){_sf=1;alert('SAVE FAILED. Storage is full or blocked, so recent changes are NOT saved. Download a backup now (Settings > Backup).')}return 0}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(x){}
const ID=/^[A-Za-z0-9_-]{1,40}$/;
function checkBk(d){if(!d||typeof d!='object'||Array.isArray(d))return'this is not a backup';if(!Array.isArray(d.meters)||!Array.isArray(d.cycles))return'meters or cycles missing';
const ok=a=>a.every(x=>x&&typeof x=='object'&&ID.test(String(x.id)));
if(!ok(d.meters))return'invalid meter id';if(!ok(d.cycles))return'invalid cycle id';if(d.accounts!==undefined&&(!Array.isArray(d.accounts)||!ok(d.accounts)))return'invalid account id';
for(const c of d.cycles){if(!c.start)return'a cycle has no start month';for(const k of Object.keys(c.rd||{}).concat(Object.keys(c.pay||{})))if(!ID.test(k))return'invalid key inside a cycle'}
return''}
function migrate(d){d.cur=d.cur||'₹';d.theme=d.theme||'auto';d.accounts=Array.isArray(d.accounts)?d.accounts:[];
if(!d.accounts.length)['Main Account','Renters','Owner','Borewell & Common'].forEach(n=>d.accounts.push({id:uid(),name:n}));
d.meters.forEach(m=>{if(!m.acc||!d.accounts.some(a=>a.id==m.acc))m.acc=d.accounts[{main:0,renter:1,owner:2,borewell:3,common:3}[m.type]||0].id});
d.cycles.forEach(c=>{c.rd=c.rd||{}});return d}
const bkJson=()=>{const o=Object.assign({},S);delete o.pin;return JSON.stringify(o)};
function copyBk(){$('#bk').value=bkJson();$('#bk').select();try{navigator.clipboard&&navigator.clipboard.writeText($('#bk').value).catch(()=>{})}catch(x){}S.lastBk=Date.now();save();bkNote()}
function dlBackup(){if(NAT()){nativeShare('bijli-backup-'+new Date().toISOString().slice(0,10)+'.json',bkJson(),true).then(()=>{S.lastBk=Date.now();save();bkNote()}).catch(()=>alert('Backup could not be shared. Try Copy backup text.'));return}const b=new Blob([bkJson()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bijli-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);S.lastBk=Date.now();save();bkNote()}
function bkNote(){const n=$('#bkn');if(!n)return;const old=!S.lastBk||Date.now()-S.lastBk>7*864e5;n.innerHTML=S.meters&&S.meters.length&&old?'<div class="card" style="margin:8px 12px"><b>⚠ No backup in the last 7 days.</b> Data lives only in this browser.<div class="row"><button onclick="dlBackup()">Download backup</button></div></div>':''}
const waNum=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length==11&&d[0]=='0')d=d.slice(1);if(d.length==10)d='91'+d;return d};

const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const f=(n,d=2)=>(+n||0).toLocaleString('en-IN',{maximumFractionDigits:d}),$$=n=>S.cur+f(n);
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TY={renter:['🏠','Renter'],owner:['👤','Landlord'],borewell:['💧','Borewell'],common:['💡','Common area'],main:['⚡','Main meter']};
let tab='home',cid=null,mid=null;
const T=[['home','📊','Home'],['meters','🔌','Meters'],['cycles','🗓️','Cycles'],['tools','🧰','Tools'],['set','⚙️','Settings']];
const cs=()=>[...S.cycles].sort((a,b)=>a.start<b.start?-1:1),cur=()=>S.cycles.find(x=>x.id==cid);
function lbl(c){const[y,m]=c.start.split('-').map(Number),n=+c.months,d=new Date(y,m-1+n-1,1);const a=MN[m-1],b=MN[d.getMonth()];return n==1?a+' '+y:d.getFullYear()==y?a+'–'+b+' '+y:a+' '+y+'–'+b+' '+d.getFullYear()}

function ask(t,fs,cb){const d=$('#dg');d.innerHTML=`<form method="dialog"><h3>${t}</h3>${fs.map(x=>`<label>${x.l}${x.o?`<select name="${x.k}">${x.o.map(o=>`<option value="${o[0]}" ${o[0]==x.v?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input name="${x.k}" type="${x.t||'text'}" value="${e(x.v)}" step="any">`}</label>`).join('')}<div class="row"><button class="g" value="x">Cancel</button><button value="ok">Save</button></div></form>`;
d.returnValue='';d.onclose=()=>{if(d.returnValue=='ok'){const o={};new FormData(d.querySelector('form')).forEach((v,k)=>o[k]=v);cb(o)}};d.showModal()}
function lastCurr(m,c){const p=cs().filter(x=>x.start<c.start&&x.rd[m.id]&&x.rd[m.id].curr!=='').pop();return p?+p.rd[m.id].curr:+m.start||0}
function calc(c){
const ms=S.meters.filter(m=>!m.off||c.rd[m.id]),R={};let sub=0,bu=0,cu=0;
ms.forEach(m=>{const r=c.rd[m.id]||{},ok=r.curr!==undefined&&r.curr!=='',pv=+r.prev,cv=+r.curr,ro=+m.roll>0?+m.roll:0,wrap=ok&&cv<pv&&ro>0&&pv<=ro&&cv<=ro,u=ok?(wrap?ro+1-pv+cv:Math.max(0,cv-pv)):0;R[m.id]={m,u,ok,wrap,bad:ok&&cv<pv&&!wrap};if(m.type!='main'&&ok)sub+=u;if(ok&&m.type=='borewell')bu+=u;if(ok&&m.type=='common')cu+=u});
const mm=ms.find(m=>m.type=='main'),mu=mm&&R[mm.id].ok?R[mm.id].u:(+c.mainUnits||0),rate=+c.rate>0?+c.rate:(mu?(+c.mainAmount||0)/mu:0),loss=Math.max(0,mu-sub),lossAmt=loss*rate,bwAmt=+c.bwAmount>0?+c.bwAmount:bu*rate;
const rn=ms.filter(m=>m.type=='renter'),ow=ms.filter(m=>m.type=='owner'),n=rn.length,act=mu?(+c.mainAmount||0)/mu:0,v3=!!c.v3,sa=v3&&!!S.showActual,ur=m=>v3&&(sa||(m.type=='owner'&&S.ownActual!==false))?(act||rate):rate,per=v3?(sa?bu*act/(n||1):(S.bwShare==null?500:+S.bwShare||0)):(c.v2?0:bwAmt);
rn.concat(ow).forEach(m=>{const x=R[m.id];x.bw=m.type=='renter'?per:0;x.share=rate?x.bw/rate:0;x.tu=x.u+x.share;x.ob=x.u*ur(m);x.amt=x.ok?x.ob+x.bw+(+c.extra||0):0;x.paid=((c.pay||{})[m.id]||[]).reduce((a,p)=>a+ +p.a,0);x.due=x.amt-x.paid});
const own={use:ow.reduce((a,m)=>a+R[m.id].u,0)*rate,bw:0,common:cu*rate,loss:lossAmt};own.total=own.use+own.bw+own.common+own.loss;Object.values(R).forEach(x=>{x.val=x.m.type=='borewell'?bwAmt:x.m.type=='main'?mu*rate:x.u*rate});
const ac=+c.mainAmount||0;return{R,rate,mu,sub,loss,lossAmt,bwAmt,n,rn,bl:rn.concat(ow).map(m=>R[m.id]),own,lp:mu?loss/mu*100:0,v2:!!c.v2,actual:ac,tb:sub*rate,margin:sub*rate-ac,profit:rn.reduce((a,m)=>a+R[m.id].amt,0)-(sub?ac/sub:0)*(rn.reduce((a,m)=>a+R[m.id].u,0)+(v3?bu:0))}}
function dues(m){let a=0,p=0;cs().forEach(c=>{const x=calc(c).R[m.id];if(x&&x.amt){a+=x.amt;p+=x.paid}});return{a,p,d:a-p}}
const kp=(l,v)=>`<div><small>${l}</small><b>${v}</b></div>`;
function homeBase(){

${ch.length?`<section class="card"><h3>Units by cycle</h3><div class="ch">${ch.map(x=>`<div class="cl"><div class="b" style="height:${x.k.mu/mx*100}px"><span style="height:${x.k.sub/Math.max(1,x.k.mu)*100}%"></span></div><small>${x.l}</small></div>`).join('')}</div><p class="mu">Tall bar: main meter. Filled part: sub-meters.</p></section>`:''}`}
function meterForm(m){m=m||{};ask(m.id?'Edit meter':'Add meter',[{k:'type',l:'Meter type',v:m.type||'renter',o:Object.keys(TY).map(k=>[k,TY[k][1]])},{k:'acc',l:'Account (group)',v:m.acc||(S.accounts[0]||{}).id,o:S.accounts.map(a=>[a.id,a.name])},{k:'name',l:'Name',v:m.name},{k:'no',l:'Meter number',v:m.no},{k:'phone',l:'Mobile (for WhatsApp)',v:m.phone,t:'tel'},{k:'start',l:'Starting reading',t:'number',v:m.start||0},{k:'roll',l:'Meter max reading for rollover (optional, e.g. 99999)',t:'number',v:m.roll||''}],o=>{if(!o.name.trim())return;if(o.type=='main'&&S.meters.some(x=>x.type=='main'&&x.id!=m.id)){alert('Only one main meter is allowed.');return}if(o.type=='renter'&&/bore|motor|pump/i.test(o.name)&&confirm('This name looks like a borewell meter. Set its type to Borewell so its cost is shared?'))o.type='borewell';if(m.id)Object.assign(m,o);else S.meters.push({id:uid(),...o});save();go()})}
function delMeter(id){if(S.cycles.some(c=>c.locked&&c.rd[id])){alert('This meter is part of a locked cycle. Unlock that cycle first.');return}if(confirm('Delete this meter and its readings? This cannot be undone.')){S.meters=S.meters.filter(x=>x.id!=id);S.cycles.forEach(c=>{delete c.rd[id]});save();mid=null;go()}}
function cycles(){return`<div class="bar"><h2>Billing cycles</h2><button onclick="newCyc()">+ New cycle</button></div><section class="card">${cs().reverse().map(c=>{const k=calc(c);return`<div class="li" onclick="cid='${c.id}';go()"><span><b>${lbl(c)}</b><br><span class="mu">${f(k.sub)} units · ${$$(k.tb)}</span></span><span class="mu">${c.months} mo</span></div>`}).join('')||'<p class="mu">No cycles yet. Create one with any start month and length.</p>'}</section>`}
function newCyc(){const L=cs(),l=L[L.length-1];let st=new Date().toISOString().slice(0,7),mo=l?l.months:2;if(l){const[y,m]=l.start.split('-').map(Number),d=new Date(y,m-1+ +l.months,1);st=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
ask('New billing cycle',[{k:'start',l:'Start month',t:'month',v:st},{k:'months',l:'Length (months). Use 1, 2, 3, 6, 12 or any number',t:'number',v:mo}],o=>{if(!o.start||!(+o.months>0))return;const c={id:uid(),start:o.start,months:Math.round(+o.months),rd:{},pay:{},v2:1,v3:1};S.cycles.push(c);save();cid=c.id;tab='cycles';go()})}
function cset(k,v){const c=cur();if(c.locked)return;c[k]=v;save();out()}
function rset(id,k,v){const c=cur();if(c.locked)return;const r=c.rd[id],old=r[k];r[k]=v;
if(k=='curr'&&v!==''&&old!==''&&old!==undefined){const n=cs().filter(x=>x.start>c.start&&x.rd[id]).shift();if(n&&!n.locked&&n.rd[id].prev!==''&&+n.rd[id].prev===+old)n.rd[id].prev=v}
save();out()}
const hasEarlier=(m,c)=>cs().some(x=>x.start<c.start&&x.rd[m.id]&&x.rd[m.id].curr!=='');
function prevWarn(m,c){const r=c.rd[m.id];if(!r||r.prev===''||!hasEarlier(m,c))return'';const lc=lastCurr(m,c);return +r.prev!==lc?` <i class="w">⚠ Previous differs from last cycle's current (${f(lc)}). <a href="#" onclick="fixPrev('${m.id}');return false">Use ${f(lc)}</a></i>`:''}

S.meters.filter(m=>!m.off).forEach(m=>{if(!c.rd[m.id])c.rd[m.id]={prev:lastCurr(m,c),curr:''}});
const ms=S.meters.filter(m=>!m.off||(c.rd[m.id]&&c.rd[m.id].curr!==''));
return`<div class="bar"><button class="g" onclick="cid=null;go()">‹ Back</button><h2>${c.locked?'🔒 ':''}${lbl(c)}</h2><button class="g" onclick="pdf()">PDF</button><button class="g" onclick="lockCyc()">${c.locked?'Unlock':'Lock'}</button><button class="g" onclick="delCyc()">Delete</button></div>${c.locked?'<p class="mu">Locked: readings, rate and charges are frozen so sent bills match this record. Payments can still be added.</p>':''}
<section class="card"><h3>Electricity bill</h3><div class="grid">${inp(c,'mainAmount','Actual bill (bijli board ka real amount)')}${inp(c,'mainUnits','Total units (if no main meter)')}${inp(c,'rate','Rate per unit (blank = auto)')}${inp(c,'extra','Extra charge per renter')}
${inp(c,'bwAmount','Borewell amount (blank = auto: units × rate)')}</div></section>
<section class="card"><h3>Meter readings</h3>${ms.length?ms.map(m=>{const r=c.rd[m.id];return`<div class="rd"><b>${TY[m.type][0]} ${e(m.name)}</b><div class="grid"><label>Previous<input type="number" step="any" value="${e(r.prev)}" ${c.locked?'disabled':''} oninput="rset('${m.id}','prev',this.value)"></label><label>Current<input type="number" step="any" value="${e(r.curr)}" ${c.locked?'disabled':''} oninput="rset('${m.id}','curr',this.value)"></label><div id="u_${m.id}" class="mu"></div></div></div>`}).join(''):'<p class="mu">Add meters first.</p>'}</section><div id="out"></div>`}
function lockCyc(){const c=cur();if(!c)return;if(c.locked){if(confirm('Unlock this cycle? Bills you already sent may no longer match if you change readings or rates.')){delete c.locked;save();go()}}else{c.locked=Date.now();save();go()}}
function issueChk(){const c=cur();if(c&&!c.locked&&confirm('Lock this cycle now? Readings, rate and charges get frozen so the bill you send always matches your record. Payments can still be added. You can unlock later.')){c.locked=Date.now();save();setTimeout(go,400)}return true}
function delCyc(){const c=cur();if(c&&c.locked&&!confirm('This cycle is locked (bills were issued). Delete it anyway?'))return;if(confirm('Delete this cycle with all readings and payments?')){S.cycles=S.cycles.filter(x=>x.id!=cid);save();cid=null;go()}}
function spike(x,c){const p=cs().filter(y=>y.start<c.start&&y.rd[x.m.id]&&y.rd[x.m.id].curr!=='').slice(-3).map(y=>y.rd[x.m.id].curr-y.rd[x.m.id].prev),a=p.length?p.reduce((s,v)=>s+v,0)/p.length:0;return a>0&&x.u>1.5*a?' <i class="w">⚠ high vs average</i>':''}
function msg(c,x,k){return`Electricity bill ${lbl(c)}\n${x.m.name}\nUnits: ${f(x.u)}\n${x.bw>0?'Borewell share: '+$$(x.bw)+'\n':''}Rate: ${S.cur}${f(x.u?x.ob/x.u:k.rate,3)}\nAmount: ${$$(x.amt)}\nPaid: ${$$(x.paid)}\nPrevious balance: ${$$(PB(x.m.id,c))}\nTotal due: ${$$(PB(x.m.id,c)+x.due)}`}
function out(){const c=cur();if(!c||!$('#out'))return;const k=calc(c);
Object.values(k.R).forEach(x=>{const el=$('#u_'+x.m.id);if(el)el.innerHTML=x.ok?`<b>${f(x.u)}</b> units${x.bad?' <i class="w">⚠ below previous. If the meter rolled over, set its max reading in Meters.</i>':''}${x.wrap?' <i class="mu">↻ rollover counted</i>':''}${prevWarn(x.m,c)}${spike(x,c)}`:'Enter current reading'});
$('#out').innerHTML=`<section class="card"><h3>Summary</h3><div class="kp">${kp('Main units',f(k.mu))}${kp('Rate / unit',S.cur+f(k.rate,3))}${kp('Sub-meter units',f(k.sub))}${kp('Loss',f(k.loss)+' ('+f(k.lp,1)+'%)')}</div>${k.lp>15?'<p class="w">⚠ Loss is above 15%. Check meters and wiring.</p>':''}</section>`+marginCard(k)+accCard(k)+ownCard(k)+
k.bl.map(x=>`<section class="card"><div class="bar"><h3>${e(x.m.name)}</h3><b class="${x.due>0.5?'w':'ok'}">${x.ok?(x.due>0.5?'Due '+$$(x.due):'Paid'):'No reading'}</b></div><div class="kp">${kp('Own units',f(x.u))}${kp('Own bill',$$(x.ob))}${x.bw>0?kp('Borewell share',$$(x.bw)):''}${kp('Bill',$$(x.amt))}${kp('Paid',$$(x.paid))}</div><div class="row"><button onclick="pay('${x.m.id}')">Add payment</button><button class="g" onclick="pdf('${x.m.id}')">PDF bill</button><a onclick="return issueChk()" href="https://wa.me/${waNum(x.m.phone)}?text=${encodeURIComponent(msg(c,x,k))}" target="_blank" rel="noopener"><button class="am">WhatsApp</button></a></div></section>`).join('')}
function pay(id){const c=cur();ask('Add payment',[{k:'a',l:'Amount',t:'number'},{k:'d',l:'Date',t:'date',v:new Date().toISOString().slice(0,10)},{k:'m',l:'Mode',v:'cash',o:[['cash','Cash'],['upi','UPI'],['bank','Bank transfer']]}],o=>{if(!(+o.a>0))return;const _m=S.meters.find(z=>z.id==id),_o=_m?dues(_m).d:0;if(+o.a>_o+0.5&&!confirm('This is more than the outstanding '+$$(Math.max(0,_o))+'. The extra '+$$(+o.a-Math.max(0,_o))+' will count as advance credit. Save anyway?'))return;(c.pay[id]=c.pay[id]||[]).push({a:+o.a,d:o.d,m:o.m});save();out()})}
function setsBase(){return`<section class="card"><h3>Preferences</h3><div class="grid"><label>Currency symbol<input value="${e(S.cur)}" oninput="S.cur=this.value;save()"></label><label>Theme<select onchange="S.theme=this.value;theme();save()">${['auto','light','dark'].map(t=>`<option ${S.theme==t?'selected':''}>${t}</option>`).join('')}</select></label></div></section>
<section class="card"><h3>Bill and payment</h3><p class="mu">Shown on every PDF bill. UPI ID creates a pay QR code with the balance amount filled in.</p><div class="grid"><label>UPI ID<input placeholder="name@bank" value="${e(S.upi||'')}" oninput="S.upi=this.value;save()"></label><label>Payee name<input placeholder="Your name" value="${e(S.upiName||'')}" oninput="S.upiName=this.value;save()"></label></div><label style="margin-top:10px">Notes and terms (one per line, blank = default)<textarea rows="3" oninput="S.billNote=this.value;save()">${e(S.billNote||'')}</textarea></label></section>
<section class="card"><h3>Backup and restore</h3><p class="mu">Data is stored in this browser only. Download a backup file regularly and keep it in Drive or WhatsApp. The PIN is not included in backups.</p><textarea id="bk" rows="4"></textarea><div class="row"><button onclick="dlBackup()">Download backup file</button><button class="g" onclick="copyBk()">Copy backup text</button><button class="g" onclick="$('#bf').click()">Restore from file</button><input id="bf" type="file" accept=".json,application/json" hidden onchange="restoreFile(this)"><button class="g" onclick="restore()">Restore from text</button><button class="g" onclick="wipe()">Erase all data</button></div></section>`}
function restore(){let d;try{d=JSON.parse($('#bk').value)}catch(x){return alert('Backup text is not valid. Paste the full backup and try again.')}
const er=checkBk(d);if(er)return alert('Backup rejected: '+er+'.');

try{localStorage.setItem(K+'_prev',JSON.stringify(S))}catch(x){}
const pin=S.pin;S=migrate(d);if(pin)S.pin=pin;else delete S.pin;save();theme();go()}

function hero(){const L=cs(),rn=S.meters.filter(m=>m.type=='renter'),tot=rn.reduce((a,m)=>a+Math.max(0,dues(m).d),0),bill=L.reduce((a,c)=>a+calc(c).bl.filter(x=>x.m.type=='renter').reduce((q,x)=>q+x.amt,0),0),p=bill?Math.max(0,Math.min(1,1-tot/bill)):0,t=f(Math.round(tot),0);
return`<section class="hero"><small>Total pending</small><div class="od" aria-label="${$$(tot)}"><span class="cu">${e(S.cur)}</span>${[...t].map(c=>c==','?'<span class="cm">,</span>':`<span class="dg">${c}</span>`).join('')}</div><div class="pb"><i style="width:${p*100}%"></i></div><small>${Math.round(p*100)}% collected · ${rn.length} renters · ${L.length} cycles</small></section>`}
const marginCard=k=>{if(!S.showMargin)return'';if(!(k.actual>0))return'<section class="card"><h3>Margin</h3><p class="mu">Actual bill daalo to margin dikhega.</p></section>';return`<section class="card"><h3>Margin (sirf tumhare liye)</h3><div class="kp">${kp('Actual bill',$$(k.actual))}${kp('Total bill ('+f(k.sub)+' × '+S.cur+f(k.rate,3)+')',$$(k.tb))}${kp('Margin (kaagaz)','<span class="'+(k.margin<0?'w':'ok')+'">'+$$(k.margin)+'</span>')}${kp('Asli fayda (hath me)','<span class="'+(k.profit<0?'w':'ok')+'">'+$$(k.profit)+'</span>')}${kp('Borewell value',$$(k.bwAmt))}</div><p class="mu">Margin = sub-meter units × rate − actual bill. Asli fayda = renters ka total bill − renters ki units + borewell ka actual kharcha (actual bill ÷ sub-meter units).</p></section>`};
const marginHome=()=>{if(!S.showMargin)return'';const L=cs().map(c=>({c,k:calc(c)})).filter(r=>r.k.actual>0&&r.k.mu>0);if(!L.length)return'';const tm=L.reduce((a,r)=>a+r.k.margin,0),tp=L.reduce((a,r)=>a+r.k.profit,0);return`<section class="card"><h3>Margin (sirf tumhare liye)</h3><div class="kp">${kp('Total margin (kaagaz)',$$(tm))}${kp('Asli fayda (hath me)',$$(tp))}</div>${L.slice().reverse().map(r=>`<div class="li" style="cursor:default"><span>${lbl(r.c)}<br><span class="mu">Actual ${$$(r.k.actual)} · Total ${$$(r.k.tb)}</span></span><span style="text-align:right"><b class="${r.k.margin<0?'w':'ok'}">${$$(r.k.margin)}</b><br><span class="mu">Fayda ${$$(r.k.profit)}</span></span></div>`).join('')}</section>`};
const marginSet=()=>`<section class="card"><h3>Margin</h3><p class="mu">Actual bill aur margin sirf yahan chalu karne par dikhenge. PDF, WhatsApp aur statement me ye kabhi nahi aate.</p><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" style="width:auto;margin:0" ${S.showMargin?'checked':''} onchange="S.showMargin=this.checked;save()"> Margin dikhao</label></section>`;
function home(){return S.meters.length?hero()+marginHome()+allCard()+homeBase():homeBase()}
const pinCard=()=>`<section class="card"><h3>App lock</h3><p class="mu">${S.pin?'PIN lock is on.':'Set a 4 to 6 digit PIN.'} It only keeps casual snoopers out and does not encrypt your data. If you forget the PIN, only a backup file can save your data.</p><div class="row"><button onclick="setPin()">${S.pin?'Change PIN':'Set PIN'}</button>${S.pin?'<button class="g" onclick="delete S.pin;save();go()">Remove PIN</button>':''}</div></section>`;
const hx=a=>[...a].map(x=>x.toString(16).padStart(2,'0')).join(''),unhx=t=>new Uint8Array(t.match(/../g).map(h=>parseInt(h,16)));
const hasCr=()=>!!(window.crypto&&crypto.subtle);
async function hashPin(p,salt,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return hx(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},k,256)))}
async function mkPin(p){const sl=crypto.getRandomValues(new Uint8Array(16));return{s:hx(sl),i:100000,h:await hashPin(p,sl,100000)}}
function setPin(){if(!hasCr())return alert('PIN needs a secure (https) page.');ask('Set PIN',[{k:'p',l:'PIN (4 to 6 digits)',t:'password',v:''}],async o=>{if(!/^\d{4,6}$/.test(o.p))return alert('The PIN must be 4 to 6 digits.');S.pin=await mkPin(o.p);save();go()})}
async function unlock(){const i=document.getElementById('pn'),pe=document.getElementById('pe');let L={};try{L=JSON.parse(localStorage.getItem(K+'_lk')||'{}')}catch(x){}
if(L.until>Date.now()){pe.textContent='Too many attempts. Wait '+Math.ceil((L.until-Date.now())/1000)+' s.';i.value='';return}
let ok=false;
if(typeof S.pin=='string'){ok=i.value===S.pin;if(ok&&hasCr()){try{S.pin=await mkPin(i.value);save()}catch(x){}}}
else if(S.pin&&S.pin.h){try{ok=await hashPin(i.value,unhx(S.pin.s),S.pin.i)===S.pin.h}catch(x){}}
if(ok){try{localStorage.removeItem(K+'_lk')}catch(x){}document.getElementById('lk').remove();return}
const n=(L.n||0)+1,w=n>=5?Math.min(300,30*2**(n-5)):0;try{localStorage.setItem(K+'_lk',JSON.stringify({n,until:w?Date.now()+w*1e3:0}))}catch(x){}
pe.textContent=w?'Too many attempts. Wait '+w+' s.':'Incorrect PIN. Try again.';i.value=''}
if(S.pin){const d=document.createElement('div');d.id='lk';d.innerHTML='<div><h2>⚡ Bijli Manager Pro</h2><p class="mu">Enter your PIN to continue</p><input id="pn" type="password" inputmode="numeric" maxlength="6" autofocus onkeydown="if(event.key===\'Enter\')unlock()"><button onclick="unlock()">Unlock</button><p id="pe" class="w"></p></div>';document.body.appendChild(d)}

TL.splice(1,0,['☁️ Server tools (internet + server chahiye)',[['sc','⚙️','Server settings'],['sd','📝','PDF → Word'],['sx','📊','PDF → Excel'],['sp','📽️','PDF → PPT'],['so','📄','Word/Excel/PPT → PDF'],['sl','🔒','Password lagao'],['su','🔓','Password hatao']]]);
const SRK=K+'_srv';
const SR=()=>{try{return JSON.parse(localStorage.getItem(SRK)||'{}')||{}}catch(x){return{}}};
const srPut=o=>{try{localStorage.setItem(SRK,JSON.stringify(o));return 1}catch(x){return 0}};
const srOk=()=>{const c=SR();return !!(c.u&&c.t)};
const srBusy=()=>'<p class="mu">☁️ Server par process ho raha hai… (badi file me 1-2 minute lag sakte hain, app band mat karo)</p>';
const srHead=()=>{const c=SR();return (srOk()?`<p class="mu">☁️ Server: ${e(c.u.replace(/^https?:\/\//,''))}</p>`:`<p class="w">⚠ Server abhi set nahi hai.</p><div class="row"><button class="g" onclick="tl='sc';go()">⚙️ Server settings kholo</button></div>`)+'<p class="mu">Ye tool file ko tumhare server par bhejta hai. Kaam hote hi server se file delete ho jati hai.</p>'};
function srUrl(u){u=(u||'').trim().replace(/\/+$/,'');if(!/^https?:\/\/[^\s/]+/i.test(u))throw new Error('URL https:// se shuru hona chahiye, jaise https://tools.tumhara-domain.com');if(/^http:\/\//i.test(u)&&!/^http:\/\/(localhost|127\.|192\.168\.|10\.)/i.test(u))throw new Error('Internet wale server ke liye https:// chahiye (http:// phone par block ho jata hai).');return u}
async function srFetch(path,opt,ms){const c=SR();if(!c.u||!c.t)throw new Error('Pehle "Server settings" me URL aur token daalo.');const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms||180000);let r;
try{r=await fetch(c.u+path,Object.assign({signal:ac.signal},opt,{headers:{Authorization:'Bearer '+c.t}}))}
catch(x){throw new Error(x&&x.name=='AbortError'?'Server ne bahut der laga di. File chhoti karke ya kam pages ke saath try karo.':'Server tak pahunch nahi paye. Internet, URL aur https check karo (server band bhi ho sakta hai).')}
finally{clearTimeout(tm)}
if(!r.ok){let m='Server error ('+r.status+')';try{m=(await r.json()).error||m}catch(x){}throw new Error(m)}
return r}
async function srCall(path,fl,fields){const c=SR();if(c.mb&&fl.size>c.mb*1048576)throw new Error('File '+fz(fl.size)+' ki hai. Server ki limit '+c.mb+' MB hai.');const fd=new FormData();fd.append('file',fl,fl.name);for(const k in(fields||{}))fd.append(k,fields[k]);return(await srFetch(path,{method:'POST',body:fd})).blob()}
function srPick(rx,what){const f=$('#f').files[0];if(!f)throw new Error('Pehle file chuno');if(!rx.test(f.name))throw new Error('Yahan sirf '+what+' file chalegi');return f}
async function srSave(){const s=$('#sr_s');try{const u=srUrl($('#sr_u').value),t=$('#sr_t').value.trim();if(t.length<16)throw new Error('Token kam se kam 16 characters ka hona chahiye (wahi jo server par API_TOKEN me rakha hai).');const old=SR();srPut({u,t});s.className='mu';s.textContent='Check ho raha hai…';
let h;try{h=await(await srFetch('/health',{method:'GET'},20000)).json()}catch(x){srPut(old);throw x}
srPut({u,t,mb:h.max_mb,mp:h.max_pages,lo:!!h.libreoffice,pp:!!h.poppler});
s.className='mu';s.innerHTML=`✅ Server chal raha hai · limit ${h.max_mb} MB / ${h.max_pages} pages<br>Word/Excel/PPT → PDF: ${h.libreoffice?'✅':'❌ (server par LibreOffice nahi)'}<br>PDF → PPT (image): ${h.poppler?'✅':'❌ (server par poppler nahi)'}`}
catch(x){s.className='w';s.textContent='⚠ '+(x.message||x)}}
function srClear(){if(!confirm('Server URL aur token is phone se hata dein?'))return;try{localStorage.removeItem(SRK)}catch(x){}go()}
const sdRun=()=>run(async()=>{const f=srPick(/\.pdf$/i,'PDF');tr(srBusy());const b=await srCall('/v1/pdf-to-docx',f);showOut([{name:bn(f.name)+'.docx',blob:b,note:'Word file'}])});
const sxRun=()=>run(async()=>{const f=srPick(/\.pdf$/i,'PDF');tr(srBusy());const b=await srCall('/v1/pdf-to-xlsx',f,{text_fallback:$('#sx_t').checked?'1':'0'});showOut([{name:bn(f.name)+'.xlsx',blob:b,note:'Excel file'}])});
const spRun=()=>run(async()=>{const f=srPick(/\.pdf$/i,'PDF');tr(srBusy());const b=await srCall('/v1/pdf-to-pptx',f,{mode:$('#sp_m').value});showOut([{name:bn(f.name)+'.pptx',blob:b,note:'PowerPoint file'}])});
const soRun=()=>run(async()=>{const f=srPick(/\.(docx?|xlsx?|pptx?|odt|ods|odp|rtf|txt|csv)$/i,'Word / Excel / PPT / ODF / RTF / TXT / CSV');tr(srBusy());const b=await srCall('/v1/office-to-pdf',f);showOut([{name:bn(f.name)+'.pdf',blob:b,note:'PDF'}])});
const slRun=()=>run(async()=>{const f=srPick(/\.pdf$/i,'PDF'),p=$('#sl_p').value,q=$('#sl_q').value;if(p.length<4)throw new Error('Password kam se kam 4 characters ka rakho');if(new TextEncoder().encode(p).length>100)throw new Error('Password 100 characters se chhota rakho');if(p!==q)throw new Error('Dono password match nahi karte');tr(srBusy());const b=await srCall('/v1/pdf-protect',f,{password:p});showOut([{name:bn(f.name)+'_protected.pdf',blob:b,note:'Password lag gaya. Yaad rakho, bhoolne par wapas nahi milega'}])});
const suRun=()=>run(async()=>{const f=srPick(/\.pdf$/i,'PDF'),p=$('#su_p').value;if(!p)throw new Error('PDF ka password daalo');tr(srBusy());const b=await srCall('/v1/pdf-unprotect',f,{password:p});showOut([{name:bn(f.name)+'_unlocked.pdf',blob:b,note:'Password hat gaya'}])});
const srTg=id=>{const i=$('#'+id);if(i)i.type=i.type=='password'?'text':'password'};
Object.assign(V,{
sc:['Server settings',()=>{const c=SR();return`<label>Server URL<input id="sr_u" value="${e(c.u||'')}" placeholder="https://tools.tumhara-domain.com" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false"></label><label>API token<input id="sr_t" type="password" value="${e(c.t||'')}" autocomplete="off" autocapitalize="off" spellcheck="false"></label><div class="row"><button onclick="srSave()">Save + Test</button><button class="g" onclick="srTg('sr_t')">👁 Token dikhao</button><button class="g" onclick="srClear()">Hatao</button></div><p id="sr_s" class="mu"></p><p class="mu">URL aur token sirf is phone me save hote hain (backup file me nahi jate). Token wahi hai jo server par <b>API_TOKEN</b> me rakha hai. Ye tools sirf internet par aur server chalu hone par chalte hain.</p>`}],

TL.splice(3,0,['🎵 Audio',[['at','✂️','Trim / Cut'],['am','🔗','Merge'],['ax','🔁','Convert'],['az','🗜️','Compress'],['av','🔊','Volume'],['as','⏩','Speed'],['an','🔇','Noise kam karo']]]);
let AUC=null,AUS=null,AT=null,AM=[];
const AUF='audio/*,.mp3,.wav,.m4a,.aac,.ogg,.opus,.flac,.amr';
const auFin=(multi,on)=>fin(AUF,multi,on);
const auCtx=()=>{if(!AUC){const A=window.AudioContext||window.webkitAudioContext;if(!A)throw new Error('Is browser me audio engine nahi hai. Chrome ya Safari use karo.');try{AUC=new A({sampleRate:44100})}catch(x){AUC=new A()}}return AUC};
const tick=()=>new Promise(r=>setTimeout(r,0));
const auFiles=()=>{const fs=[...$('#f').files];if(!fs.length)throw new Error('Pehle audio file chuno');return fs};
async function auDec(f){
if(f.size>120*1048576)throw new Error(f.name+' bahut badi hai ('+fz(f.size)+'). 120 MB se chhoti file chuno.');
const c=auCtx();let ab;
try{const raw=await f.arrayBuffer();ab=await new Promise((ok,no)=>{const p=c.decodeAudioData(raw,ok,no);if(p&&p.catch)p.catch(no)})}
catch(x){throw new Error('Audio khuli nahi: '+f.name+' (is format ko ye browser nahi padh paya, ya file kharab hai)')}
if(ab.duration>1800)throw new Error(f.name+' 30 minute se lambi hai. Phone me itni badi audio process nahi hogi. Pehle chhota hissa kaato.');
return{sr:ab.sampleRate,ch:Array.from({length:ab.numberOfChannels},(_,i)=>ab.getChannelData(i).slice())}}
const auLen=o=>o.ch[0].length,auDur=o=>auLen(o)/o.sr;
const auPeak=o=>{let p=0;for(const c of o.ch)for(let i=0;i<c.length;i++){const v=c[i]<0?-c[i]:c[i];if(v>p)p=v}return p};
const auDb=v=>v>0?(20*Math.log10(v)).toFixed(1)+' dB':'-∞ dB';
const auMono=o=>{if(o.ch.length==1)return o;const n=auLen(o),m=new Float32Array(n),k=o.ch.length;for(const c of o.ch)for(let i=0;i<n;i++)m[i]+=c[i]/k;return{sr:o.sr,ch:[m]}};
const auTime=s=>{s=String(s).trim().replace(',','.');if(!s)return NaN;const p=s.split(':').map(Number);if(p.length>3||p.some(isNaN))return NaN;return p.reduce((a,b)=>a*60+b,0)};
const auFmt=t=>{const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2)};
const auCut=(o,a,b)=>({sr:o.sr,ch:o.ch.map(c=>c.slice(a,b))});
function auFade(o,ms,w){const n=Math.min(Math.round(o.sr*ms/1000),auLen(o)>>1);for(const c of o.ch)for(let i=0;i<n;i++){const g=i/n;if(w!='o')c[i]*=g;if(w!='i')c[c.length-1-i]*=g}}
function auCat(l,gap){const sr=l[0].sr,g=Math.round(gap*sr),K=Math.max(...l.map(o=>o.ch.length)),tot=l.reduce((a,o)=>a+auLen(o),0)+g*(l.length-1),ch=[];
for(let c=0;c<K;c++){const y=new Float32Array(tot);let p=0;for(const o of l){y.set(o.ch[Math.min(c,o.ch.length-1)],p);p+=auLen(o)+g}ch.push(y)}return{sr,ch}}
const auOC=()=>window.OfflineAudioContext||window.webkitOfflineAudioContext;
const auBuf=(oc,o)=>{const b=oc.createBuffer(o.ch.length,auLen(o),o.sr);o.ch.forEach((c,i)=>b.copyToChannel(c,i));return b};
const auGet=r=>Array.from({length:r.numberOfChannels},(_,i)=>r.getChannelData(i).slice());
async function auRes(o,sr){if(o.sr==sr)return o;const oc=new(auOC())(o.ch.length,Math.max(1,Math.round(auLen(o)*sr/o.sr)),sr),s=oc.createBufferSource();s.buffer=auBuf(oc,o);s.connect(oc.destination);s.start();return{sr,ch:auGet(await oc.startRendering())}}
async function auRate(o,r){const oc=new(auOC())(o.ch.length,Math.max(1,Math.round(auLen(o)/r)),o.sr),s=oc.createBufferSource();s.buffer=auBuf(oc,o);s.playbackRate.value=r;s.connect(oc.destination);s.start();return{sr:o.sr,ch:auGet(await oc.startRendering())}}
async function auHP(o,hz){const oc=new(auOC())(o.ch.length,auLen(o),o.sr),s=oc.createBufferSource();s.buffer=auBuf(oc,o);let nd=s;for(let i=0;i<2;i++){const f=oc.createBiquadFilter();f.type='highpass';f.frequency.value=hz;f.Q.value=.707;nd.connect(f);nd=f}nd.connect(oc.destination);s.start();return{sr:o.sr,ch:auGet(await oc.startRendering())}}
function auWav(o){const n=auLen(o),k=o.ch.length,b=new ArrayBuffer(44+n*k*2),v=new DataView(b),w=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i))};
w(0,'RIFF');v.setUint32(4,36+n*k*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,k,true);v.setUint32(24,o.sr,true);v.setUint32(28,o.sr*k*2,true);v.setUint16(32,k*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*k*2,true);
let p=44;for(let i=0;i<n;i++)for(let j=0;j<k;j++){const s=Math.max(-1,Math.min(1,o.ch[j][i]));v.setInt16(p,s<0?s*32768:s*32767,true);p+=2}
return new Blob([b],{type:'audio/wav'})}
const LJ=()=>lj('https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js','lamejs').catch(()=>lj('https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js','lamejs')).catch(()=>{throw new Error('MP3 engine load nahi hui. Internet check karo, ya Format me WAV chuno.')});
async function auMp3(o,kbps,label){await LJ();
if(![8000,11025,12000,16000,22050,24000,32000,44100,48000].includes(o.sr))o=await auRes(o,44100);
const k=Math.min(2,o.ch.length),enc=new lamejs.Mp3Encoder(k,o.sr,kbps),n=auLen(o),parts=[],B=1152*20;
const I=c=>{const a=new Int16Array(c.length);for(let i=0;i<c.length;i++){const s=Math.max(-1,Math.min(1,c[i]));a[i]=s<0?s*32768:s*32767}return a};
const L=I(o.ch[0]),R=k>1?I(o.ch[1]):null;
for(let i=0,j=0;i<n;i+=B,j++){const l=L.subarray(i,i+B),b=R?enc.encodeBuffer(l,R.subarray(i,i+B)):enc.encodeBuffer(l);if(b.length)parts.push(new Uint8Array(b));if(j%25==0){tr(`<p class="mu">${e(label||'MP3 ban rahi hai')}… ${Math.round(i*100/n)}%</p>`);await tick()}}
const f=enc.flush();if(f.length)parts.push(new Uint8Array(f));
return new Blob(parts,{type:'audio/mpeg'})}
const auOpts=()=>`<div class="grid"><label>Format<select id="au_f" onchange="auFm()"><option value="mp3">MP3</option><option value="wav">WAV (bada, original quality)</option></select></label><label id="au_kl">MP3 quality<select id="au_k"><option value="64">64 kbps (chhota)</option><option value="96">96 kbps</option><option value="128" selected>128 kbps (accha)</option><option value="192">192 kbps</option><option value="256">256 kbps (best)</option></select></label></div><p class="mu">MP3 ke liye ek chhoti library pehli baar download hoti hai (net chahiye). WAV ke liye net nahi chahiye.</p>`;
const auFm=()=>{const l=$('#au_kl');if(l)l.style.display=$('#au_f').value=='mp3'?'':'none'};
async function auSave(o,name,note){const f=$('#au_f').value;return{name:name+'.'+f,blob:f=='wav'?auWav(o):await auMp3(o,+$('#au_k').value),note}}
function auShow(a){showOut(a);const h=$('#tr .card h3');if(h&&a[0]&&/^audio\//.test(a[0].blob.type))h.insertAdjacentHTML('afterend',`<audio controls src="${URL.createObjectURL(a[0].blob)}" style="width:100%;margin:6px 0"></audio>`)}
const auPre=(i,n,f,w)=>tr(`<p class="mu">${n>1?i+1+'/'+n+' · ':''}${e(f.name)} ${w||'padh raha hoon'}…</p>`);

/* ---- Speed: pitch same rakhne ke liye WSOLA ---- */
async function auWsola(o,s){
const sr=o.sr,N=sr>=40000?2048:1024,H=N>>1,tol=N>>2,D=4,len=auLen(o),K=o.ch.length,outLen=Math.max(1,Math.floor(len/s)),pad=N*2+tol+8;
const X=o.ch.map(c=>{const a=new Float32Array(len+pad);a.set(c);return a});
const dl=((len+pad)/D)|0,dm=new Float32Array(dl);
for(let i=0;i<dl;i++){let a=0;const b=i*D;for(let c=0;c<K;c++){const x=X[c];a+=x[b]+x[b+1]+x[b+2]+x[b+3]}dm[i]=a/(4*K)}
const win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=.5-.5*Math.cos(2*Math.PI*i/N);
const Y=o.ch.map(()=>new Float32Array(outLen+N)),W=new Float32Array(outLen+N),Nd=N/D;let prev=0;
for(let f=0,out=0;out<outLen;f++,out+=H){
let pos=0;
if(f>0){const nom=Math.round(f*H*s),lo=Math.max(0,nom-tol),hi=Math.min(len-1,nom+tol);
if(lo>=hi)pos=Math.min(len-1,Math.max(0,nom));
else{const tg=((prev+H)/D)|0;let best=1e30;pos=lo;for(let p=lo;p<=hi;p+=D){const pd=(p/D)|0;let sad=0;for(let i=0;i<Nd;i+=2){const d=dm[pd+i]-dm[tg+i];sad+=d<0?-d:d}if(sad<best){best=sad;pos=p}}}}
for(let c=0;c<K;c++){const x=X[c],y=Y[c];for(let i=0;i<N;i++)y[out+i]+=x[pos+i]*win[i]}
for(let i=0;i<N;i++)W[out+i]+=win[i];
prev=pos;
if(f%120==0){tr(`<p class="mu">Speed badal raha hoon… ${Math.round(out*100/outLen)}%</p>`);await tick()}}
for(const y of Y)for(let i=0;i<outLen;i++){const w=W[i];if(w>1e-3)y[i]/=w}
return{sr,ch:Y.map(y=>y.slice(0,outLen))}}

/* ---- Noise gate ---- */
function auGate(o,st){
const sr=o.sr,n=auLen(o),fr=Math.max(1,Math.round(sr*.01)),nf=Math.ceil(n/fr),rms=new Float32Array(nf);
for(let f=0;f<nf;f++){let m=0;const a=f*fr,b=Math.min(n,a+fr);for(const c of o.ch){let s=0;for(let i=a;i<b;i++)s+=c[i]*c[i];s/=(b-a);if(s>m)m=s}rms[f]=Math.sqrt(m)}
const srt=Array.from(rms).sort((x,y)=>x-y),floor=Math.max(srt[Math.floor(nf*.1)],1e-5),cfg=[{m:2,r:.25},{m:3,r:.1},{m:4.5,r:.03}][st],thr=floor*cfg.m;
const op=new Uint8Array(nf);for(let f=0;f<nf;f++)op[f]=rms[f]>thr?1:0;
const hd=new Uint8Array(nf);let cn=0;for(let f=0;f<nf;f++){if(op[f])cn=15;if(cn>0){hd[f]=1;cn--}}
for(let f=0;f<nf;f++)if(op[f])for(let j=1;j<=3&&f-j>=0;j++)hd[f-j]=1;
const aA=1-Math.exp(-1/(sr*.005)),aR=1-Math.exp(-1/(sr*.08)),g=new Float32Array(n);let cur=1,cut=0;
for(let f=0;f<nf;f++)if(!hd[f])cut++;
for(let i=0;i<n;i++){const t=hd[(i/fr)|0]?1:cfg.r;cur+=(t-cur)*(t>cur?aA:aR);g[i]=cur}
for(const c of o.ch)for(let i=0;i<n;i++)c[i]*=g[i];
return Math.round(cut*100/nf)}

/* ---- Trim ---- */
function atPk(o,W){const n=auLen(o),pk=new Float32Array(W),st=Math.max(1,Math.floor(n/W/40));for(let i=0;i<W;i++){const s=Math.floor(i*n/W),t=Math.floor((i+1)*n/W);let p=0;for(let j=s;j<t;j+=st)for(const c of o.ch){const v=c[j]<0?-c[j]:c[j];if(v>p)p=v}pk[i]=p}let mx=0;for(const v of pk)if(v>mx)mx=v;if(mx>0)for(let i=0;i<W;i++)pk[i]/=mx;return pk}
function atDraw(){const c=$('#at_w');if(!c||!AT)return;const x=c.getContext('2d'),W=c.width,H=c.height,d=auDur(AT.o),a=Math.floor(AT.a/d*W),b=Math.ceil(AT.b/d*W);x.clearRect(0,0,W,H);
for(let i=0;i<W;i++){const h=Math.max(1,AT.pk[i]*(H-6));x.fillStyle=(i>=a&&i<b)?'#0e7c86':'#8a99a3';x.fillRect(i,(H-h)/2,1,h)}
$('#at_i').textContent='Total '+auFmt(d)+' · Chuna hua '+auFmt(Math.max(0,AT.b-AT.a))}
function atStop(){if(AUS){try{AUS.stop()}catch(x){}AUS=null}}
async function atLoad(){const f=$('#f').files[0];$('#at_b').style.display='none';atStop();AT=null;if(!f)return;tr('<p class="mu">Audio padh raha hoon…</p>');
try{const o=await auDec(f);AT={o,n:f.name,a:0,b:auDur(o),pk:atPk(o,600)};$('#at_a').value='0';$('#at_e').value=AT.b.toFixed(2);$('#at_sa').value=0;$('#at_sb').value=1000;$('#at_b').style.display='block';tr('');atDraw()}catch(x){tr(`<p class="w">⚠ ${e(x.message)}</p>`)}}
function atSl(){if(!AT)return;const d=auDur(AT.o);let a=$('#at_sa').value/1000*d,b=$('#at_sb').value/1000*d;
if(b-a<.05){if(document.activeElement&&document.activeElement.id=='at_sa'){a=Math.max(0,b-.05);$('#at_sa').value=a/d*1000}else{b=Math.min(d,a+.05);$('#at_sb').value=b/d*1000}}

function atTxt(){if(!AT)return;const d=auDur(AT.o),a=auTime($('#at_a').value),b=auTime($('#at_e').value);if(!isNaN(a)&&a>=0&&a<d)AT.a=a;if(!isNaN(b)&&b>0&&b<=d+.001)AT.b=Math.min(b,d);$('#at_sa').value=AT.a/d*1000;$('#at_sb').value=AT.b/d*1000;atDraw()}
function atPlay(){if(!AT)return;atStop();const c=auCtx();if(c.resume)c.resume();const o=AT.o;if(!AT.ab)AT.ab=auBuf({createBuffer:(k,n,r)=>c.createBuffer(k,n,r)},o);const a=Math.max(0,AT.a),b=Math.min(auDur(o),AT.b);if(b<=a)return;const s=c.createBufferSource();s.buffer=AT.ab;s.connect(c.destination);s.start(0,a,b-a);AUS=s;s.onended=()=>{if(AUS===s)AUS=null}}
const atRun=()=>run(async()=>{if(!AT)throw new Error('Pehle audio file chuno');atStop();const o=AT.o,d=auDur(o),a=auTime($('#at_a').value),b=auTime($('#at_e').value);
if(isNaN(a)||isNaN(b))throw new Error('Time galat hai. Jaise 12.5 ya 1:23 likho');
if(a<0||b>d+.01||a>=b)throw new Error('Shuru, End se pehle hona chahiye aur audio ke andar (0 se '+auFmt(d)+')');
const ia=Math.round(a*o.sr),ib=Math.min(auLen(o),Math.round(b*o.sr)),keep=$('#at_m').value=='keep',fd=$('#at_fd').checked;let r;
if(keep){r=auCut(o,ia,ib);if(fd)auFade(r,15,'b')}
else{if(ia<=0&&ib>=auLen(o))throw new Error('Poora audio nahi hata sakte');const p=[];if(ia>0){const x=auCut(o,0,ia);if(fd)auFade(x,15,'o');p.push(x)}if(ib<auLen(o)){const x=auCut(o,ib,auLen(o));if(fd)auFade(x,15,'i');p.push(x)}r=auCat(p,0)}
auShow([await auSave(r,bn(AT.n)+(keep?'_trim':'_cut'),'Lambai '+auFmt(auDur(r)))])});

/* ---- Merge ---- */
function amAdd(i){AM.push(...i.files);i.value='';amList()}
function amList(){const l=$('#aml');if(!l)return;l.innerHTML=AM.length?AM.map((f,i)=>`<div class="li" style="cursor:default"><span>${i+1}. ${e(f.name)}<br><span class="mu">${fz(f.size)}</span></span><span><button class="g" onclick="amMv(${i},-1)">↑</button> <button class="g" onclick="amMv(${i},1)">↓</button> <button class="g" onclick="AM.splice(${i},1);amList()">✕</button></span></div>`).join(''):'<p class="mu">Abhi koi file nahi chuni.</p>'}
function amMv(i,d){const j=i+d;if(j<0||j>=AM.length)return;[AM[i],AM[j]]=[AM[j],AM[i]];amList()}
const amRun=()=>run(async()=>{if(AM.length<2)throw new Error('Kam se kam 2 audio chuno');const l=[];let tot=0;
for(let i=0;i<AM.length;i++){auPre(i,AM.length,AM[i]);let a=await auDec(AM[i]);if(l.length&&a.sr!=l[0].sr)a=await auRes(a,l[0].sr);tot+=auDur(a);if(tot>2400)throw new Error('Total 40 minute se zyada nahi ho sakta (phone ki memory).');l.push(a)}
const r=auCat(l,+$('#am_g').value);auShow([await auSave(r,'merged','Lambai '+auFmt(auDur(r))+' · '+l.length+' files')])});

/* ---- Convert / Compress / Volume / Speed / Noise ---- */
const axRun=()=>run(async()=>{const fs=auFiles(),m=$('#ax_m').checked,o=[];for(let i=0;i<fs.length;i++){auPre(i,fs.length,fs[i]);let a=await auDec(fs[i]);if(m)a=auMono(a);const r=await auSave(a,bn(fs[i].name),'');r.note=fz(fs[i].size)+' → '+fz(r.blob.size);o.push(r)}auShow(o)});
const AZ=[['Bahut chhota (32 kbps, mono. Bolne/lecture ke liye)',22050,1,32],['Chhota (64 kbps, mono)',44100,1,64],['Medium (96 kbps)',44100,2,96],['Accha (128 kbps)',44100,2,128]];
const azRun=()=>run(async()=>{const fs=auFiles(),L=AZ[+$('#az_l').value],o=[];for(let i=0;i<fs.length;i++){const f=fs[i];auPre(i,fs.length,f);let a=await auDec(f);if(L[2]==1)a=auMono(a);a=await auRes(a,L[1]);const b=await auMp3(a,L[3],f.name+' compress ho rahi hai');o.push({name:bn(f.name)+'_small.mp3',blob:b,note:fz(f.size)+' → '+fz(b.size)+(b.size>=f.size?' ⚠ chhoti nahi hui, original hi rakho':'')})}auShow(o)});
const avRun=()=>run(async()=>{const fs=auFiles(),pc=+$('#av_g').value,nm=$('#av_n').checked,sf=$('#av_s').checked,o=[];if(!nm&&!(pc>0&&pc<=1000))throw new Error('Volume % 1 se 1000 ke beech rakho (100 = same)');
for(let i=0;i<fs.length;i++){auPre(i,fs.length,fs[i]);const a=await auDec(fs[i]),pk=auPeak(a);if(pk<1e-4)throw new Error(fs[i].name+' me awaaz hai hi nahi (bilkul shant).');
let g=nm?.97/pk:pc/100,nt='';if(!nm&&pk*g>1){if(sf){g=.99/pk;nt=' · kharab na ho isliye sirf '+Math.round(g*100)+'% badhai'}else nt=' · ⚠ awaaz kat sakti hai (clipping)'}

const am=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth()+n,1);x.setDate(Math.min(d.getDate(),new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x};
let tm=(T.getFullYear()-B.getFullYear())*12+T.getMonth()-B.getMonth();if(T.getDate()<B.getDate())tm--;
const an=am(B,tm),dd=Math.round((T-an)/864e5),y=Math.floor(tm/12),m=tm%12,days=Math.round((T-B)/864e5);
const nbf=Y=>{const x=new Date(Y,B.getMonth(),1);x.setDate(Math.min(B.getDate(),new Date(Y,B.getMonth()+1,0).getDate()));return x};
let nb=nbf(T.getFullYear());if(nb<T)nb=nbf(T.getFullYear()+1);const dn=Math.round((nb-T)/864e5);

/* ---- EMI ---- */
let EMS=null;
function emSch(P,r,emi,N){let b=P;const a=[];for(let k=1;k<=N;k++){const it=b*r,pr=k==N?b:Math.min(b,emi-it);b=Math.max(0,b-pr);a.push({k,it,pr,bal:b})}return a}
function emRun(){const o=$('#em_o');if(!o)return;const P=+$('#em_p').value,Rv=$('#em_r').value,R=+Rv,N=Math.round(+$('#em_n').value*($('#em_u').value=='y'?12:1));
if(!(P>0)||!(N>0)||Rv===''||!(R>=0)){o.innerHTML='<p class="mu">Amount, interest aur tenure daalo.</p>';EMS=null;return}
if(N>1200){o.innerHTML='<p class="w">Tenure 100 saal se zyada nahi ho sakta.</p>';EMS=null;return}
const r=R/1200,emi=r?P*r*Math.pow(1+r,N)/(Math.pow(1+r,N)-1):P/N,tot=emi*N,it=tot-P,ip=tot?it/tot*100:0,sc=emSch(P,r,emi,N),yr=[];
sc.forEach(x=>{const y=Math.ceil(x.k/12),q=yr[y-1]||(yr[y-1]={y,pr:0,it:0,bal:0});q.pr+=x.pr;q.it+=x.it;q.bal=x.bal});EMS={sc,emi};
o.innerHTML=`<div class="kp">${bigKp('Mahine ki EMI',$$(emi))}${kp('Total interest',$$(it))}${kp('Total payment',$$(tot))}</div><div class="pb" style="margin:12px 0 4px;background:var(--br)"><i style="width:${(100-ip).toFixed(1)}%"></i></div><p class="mu" style="margin:0 0 10px">Principal ${(100-ip).toFixed(0)}% · Interest ${ip.toFixed(0)}%</p><div class="sc"><table><tr><th>Saal</th><th>Principal</th><th>Interest</th><th>Balance</th></tr>${yr.map(q=>`<tr><td>${q.y}</td><td>${f(q.pr,0)}</td><td>${f(q.it,0)}</td><td>${f(q.bal,0)}</td></tr>`).join('')}</table></div><div class="row"><button class="g" onclick="emCsv()">⬇ Month-wise schedule (CSV)</button></div><p class="mu">Reducing-balance method, EMI mahine ke end me maani gayi hai. Bank ka asli schedule thoda alag ho sakta hai (processing fee, rounding, EMI date).</p>`}
const emCsv=()=>{if(!EMS)return;const L=['Month,EMI,Principal,Interest,Balance'].concat(EMS.sc.map(x=>[x.k,EMS.emi,x.pr,x.it,x.bal].map(v=>(+v).toFixed(2)).join(',')));dl('emi-schedule.csv',new Blob([L.join('\n')],{type:'text/csv'}))};

function clSet(h,skip){h=String(h).trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(h))h=h.split('').map(c=>c+c).join('');if(!/^[0-9a-f]{6}$/i.test(h))return;h=h.toLowerCase();
const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16),R=r/255,G=g/255,B=b/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2,d=mx-mn;let H=0,Sa=0;
if(d){Sa=d/(1-Math.abs(2*l-1));H=mx==R?((G-B)/d)%6:mx==G?(B-R)/d+2:(R-G)/d+4;H=Math.round(H*60);if(H<0)H+=360}
if(!$('#cl_p'))return;$('#cl_p').value='#'+h;if(!skip)$('#cl_h').value='#'+h.toUpperCase();$('#cl_r').value=`rgb(${r}, ${g}, ${b})`;$('#cl_l').value=`hsl(${H}, ${Math.round(Sa*100)}%, ${Math.round(l*100)}%)`;$('#cl_w').style.background='#'+h}

function clPx(c,ev){const r=c.getBoundingClientRect(),x=Math.min(c.width-1,Math.max(0,Math.floor((ev.clientX-r.left)*c.width/r.width))),y=Math.min(c.height-1,Math.max(0,Math.floor((ev.clientY-r.top)*c.height/r.height))),d=c.getContext('2d').getImageData(x,y,1,1).data;clSet('#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join(''))}

/* ===== PHASE 2 · STAGE 2: Data, Barcode, Zip, Rename, Compare ===== */
const XL=()=>lj('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','XLSX');
const JZ=()=>lj('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','JSZip');
const JB=()=>lj('https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js','JsBarcode');
const fsn=s=>String(s).replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').trim()||'file';
function uniq(n,used){let k=n,i=2;const m=/\.[^.]*$/.exec(n),ex=m&&m.index>0?m[0]:'',b=ex?n.slice(0,-ex.length):n;while(used.has(k.toLowerCase()))k=b+' ('+(i++)+')'+ex;used.add(k.toLowerCase());return k}
const typed=v=>typeof v=='string'&&/^-?\d+(\.\d+)?$/.test(v)&&String(+v)===v?+v:v;
const jv=v=>v==null?'':typeof v=='object'?JSON.stringify(v):v;
const XMIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

/* rows = array of arrays. Ye saare data tools ka common format hai. */
function csvRows(t,d){if(!d){const l=t.split(/\r?\n/).find(x=>x.trim())||'';let b=0;d=',';[',',';','\t','|'].forEach(c=>{const n=l.split(c).length-1;if(n>b){b=n;d=c}})}
const R=[];let r=[],c='',q=false;
for(let i=0;i<t.length;i++){const ch=t[i];
if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
else if(ch=='"'&&c==='')q=true;
else if(ch==d){r.push(c);c=''}
else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';R.push(r);r=[]}
else c+=ch}
if(c!==''||r.length){r.push(c);R.push(r)}
return R.filter(x=>x.some(y=>y!==''))}
const csvOut=rows=>rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
function jRows(j){if(!Array.isArray(j)){if(j&&typeof j=='object'){const ks=Object.keys(j).filter(k=>Array.isArray(j[k]));j=ks.length==1?j[ks[0]]:[j]}else j=[{value:j}]}
if(!j.length)return[];if(j.every(x=>Array.isArray(x)))return j.map(r=>r.map(jv));
const isO=x=>x&&typeof x=='object'&&!Array.isArray(x),H=[],hs=new Set();
j.forEach(x=>{if(isO(x))Object.keys(x).forEach(k=>{if(!hs.has(k)){hs.add(k);H.push(k)}});else if(!hs.has('value')){hs.add('value');H.push('value')}});
return[H].concat(j.map(x=>H.map(k=>jv(isO(x)?x[k]:(k=='value'?x:'')))))}
function hdrs(rows){const W=rows.reduce((m,r)=>Math.max(m,r.length),0),H=[],seen={};for(let i=0;i<W;i++){let k=String(rows[0]&&rows[0][i]!=null?rows[0][i]:'').trim()||'col_'+(i+1);if(seen[k]){seen[k]++;k=k+'_'+seen[k]}else seen[k]=1;H.push(k)}return H}
function toObjs(rows){if(!rows.length)return[];const H=hdrs(rows);return rows.slice(1).map(r=>{const o={};H.forEach((k,i)=>o[k]=typed(r[i]==null?'':r[i]));return o})}
function sRows(ws){const ref=ws['!ref'];if(!ref)return[];const r=XLSX.utils.decode_range(ref),a=[];
for(let R=r.s.r;R<=r.e.r;R++){const row=[];let any=false;for(let C=r.s.c;C<=r.e.c;C++){const c=ws[XLSX.utils.encode_cell({r:R,c:C})];let v='';if(c){v=c.t=='n'&&c.z&&XLSX.SSF.is_date(c.z)?(c.w||c.v):c.v;if(v==null)v='';if(v!=='')any=true}row.push(v)}if(any)a.push(row)}return a}
async function dRead(fl,fsv){await XL();const n=fl.name.toLowerCase();
if(/\.json$/.test(n)){let j;try{j=JSON.parse((await fl.text()).replace(/^\ufeff/,''))}catch(x){throw new Error(fl.name+': valid JSON nahi hai')}return[{name:'Sheet1',rows:jRows(j)}]}
if(/\.(csv|tsv|txt)$/.test(n)){const t=(await fl.text()).replace(/^\ufeff/,'');return[{name:'Sheet1',rows:csvRows(t,fsv==='t'?'\t':fsv)}]}
let wb;try{wb=XLSX.read(await fl.arrayBuffer(),{type:'array',cellNF:true,dateNF:'dd-mm-yyyy'})}catch(x){throw new Error(fl.name+': file khuli nahi (password laga ho ya kharab ho)')}
return wb.SheetNames.map(s=>({name:s,rows:sRows(wb.Sheets[s])}))}
function xBook(sheets){const wb=XLSX.utils.book_new(),used=new Set();sheets.forEach(s=>{const nm=(String(s.name).replace(/[\[\]:*?\/\\]/g,'_').trim()||'Sheet').slice(0,31);let k=nm,i=2;while(used.has(k.toLowerCase()))k=nm.slice(0,28)+'_'+(i++);used.add(k.toLowerCase());XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s.rows.map(r=>r.map(typed))),k)});return wb}
const xBlob=wb=>new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:XMIME});
const cBlob=rows=>new Blob(['\ufeff'+csvOut(rows)],{type:'text/csv'});
const jBlob=rows=>new Blob([JSON.stringify(toObjs(rows),null,2)],{type:'application/json'});
const rn=rows=>Math.max(0,rows.length-1)+' rows';

const dcRun=()=>run(async()=>{const fl=$('#f').files[0];if(!fl)throw new Error('Pehle file chuno');const sh=await dRead(fl,$('#dc_d').value),t=$('#dc_o').value,b=bn(fl.name),o=[];
if(!sh.some(s=>s.rows.length))throw new Error('File me data nahi mila');
if(t=='xlsx')o.push({name:b+'.xlsx',blob:xBlob(xBook(sh)),note:sh.length+' sheet · '+sh.map(s=>rn(s.rows)).join(', ')});
else sh.forEach(s=>{const nm=b+(sh.length>1?'_'+fsn(s.name):'')+'.'+t;o.push({name:nm,blob:t=='csv'?cBlob(s.rows):jBlob(s.rows),note:rn(s.rows)})});

const H=[],hs=new Set(),hp=parts.map(p=>{const h=hdrs(p.rows);h.forEach(k=>{if(!hs.has(k)){hs.add(k);H.push(k)}});return h});

const t=$('#dm_o').value;showOut([{name:'merged.'+t,blob:t=='csv'?cBlob(out):xBlob(xBook([{name:'Merged',rows:out}])),note:(out.length-1)+' rows · '+H.length+' columns'}])});
