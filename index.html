<script>
const NAT=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());

const ID=/^[A-Za-z0-9_-]{1,40}$/;

d.meters.forEach(m=>{if(!m.acc||!d.accounts.some(a=>a.id==m.acc))m.acc=d.accounts[{main:0,renter:1,owner:2,borewell:3,common:3}[m.type]||0].id});

const bkJson=()=>{const o=Object.assign({},S);delete o.pin;return JSON.stringify(o)};

d.returnValue='';d.onclose=()=>{if(d.returnValue=='ok'){const o={};new FormData(d.querySelector('form')).forEach((v,k)=>o[k]=v);cb(o)}};d.showModal()}

const ms=S.meters.filter(m=>!m.off||c.rd[m.id]),R={};let sub=0,bu=0,cu=0;
ms.forEach(m=>{const r=c.rd[m.id]||{},ok=r.curr!==undefined&&r.curr!=='',pv=+r.prev,cv=+r.curr,ro=+m.roll>0?+m.roll:0,wrap=ok&&cv<pv&&ro>0&&pv<=ro&&cv<=ro,u=ok?(wrap?ro+1-pv+cv:Math.max(0,cv-pv)):0;R[m.id]={m,u,ok,wrap,bad:ok&&cv<pv&&!wrap};if(m.type!='main'&&ok)sub+=u;if(ok&&m.type=='borewell')bu+=u;if(ok&&m.type=='common')cu+=u});

rn.concat(ow).forEach(m=>{const x=R[m.id];x.bw=m.type=='renter'?per:0;x.share=rate?x.bw/rate:0;x.tu=x.u+x.share;x.ob=x.u*ur(m);x.amt=x.ok?x.ob+x.bw+(+c.extra||0):0;x.paid=((c.pay||{})[m.id]||[]).reduce((a,p)=>a+ +p.a,0);x.due=x.amt-x.paid});

return`<section class="card sc"><div class="bar"><h3 style="flex:1;margin:0">${lbl(c)}</h3><span class="st ${st[0]}">${st[1]}</span></div><table>${T('Previous reading',f(rd.prev))+T('Current reading',f(rd.curr))+T('Own units',f(x.u))+T('Rate per unit',S.cur+f(k.rate,3))+T('Own bill',$$(x.ob))+(x.bw>0?T('Borewell share',$$(x.bw)):'')+(+c.extra?T('Extra charge',$$(+c.extra)):'')+T('<b>Total bill</b>','<b>'+$$(x.amt)+'</b>')+(r.prevBal<0?T('Advance from earlier',$$(-r.prevBal)):T('Previous balance due',$$(r.prevBal)))+T('<b>Total payable</b>','<b>'+$$(r.prevBal+x.amt)+'</b>')+T('Paid',$$(x.paid))+T('<b>Balance due</b>','<b>'+$$(r.bal)+'</b>')}</table>${pays(c).map((p,i)=>`<div class="li"><span>${p.d?dmy(p.d):''} · ${e(p.m||'')}</span><span><b>${$$(p.a)}</b> <button class="g" onclick="delPay('${c.id}','${m.id}',${i})">✕</button></span></div>`).join('')}<div class="row"><button class="g" onclick="pdfM('${c.id}','${m.id}')">PDF</button>${last&&r.bal>0.5?`<button class="g" onclick="markPaid('${c.id}','${m.id}')">Mark fully paid</button>`:''}<button onclick="payX('${c.id}','${m.id}')">+ Payment</button></div></section>`}
return`<section class="card sc"><h3>${lbl(c)}</h3><table>${T('Previous reading',f(rd.prev))+T('Current reading',f(rd.curr))+T('Units',f(x.u))+T('Rate per unit',S.cur+f(k.rate,3))+T('<b>Amount</b>','<b>'+$$(x.val)+'</b>')+(m.type=='borewell'&&!k.v2?T('Added to',k.n+' renters (full amount each)')+T('Each renter pays',$$(k.bwAmt)):'')+(m.type=='main'?T('Line loss',f(k.loss)+' units · '+$$(k.lossAmt)):'')+(m.type=='common'?T('Paid by','Landlord'):'')}</table></section>`};
const cyc=()=>{if(rcm!==mid){rcm=mid;rcid=null}const sel=rows.find(r=>r.c.id==rcid);if(sel)return`<div class="bar"><button class="g" onclick="rcid=null;go()">‹ All cycles</button><span></span></div>`+cd(sel);
const F=S.cf=Object.assign({st:'all',yr:'all',so:'new',q:''},S.cf||{}),yr=r=>(lbl(r.c).match(/\d{4}/)||[''])[0],last=rows.length?rows[rows.length-1].c.id:null,
sk=r=>r.bal<=0.5?'paid':r.x.paid>0?'partly':'unpaid',
stl=r=>r.bal<=0.5?['p','Paid']:r.c.id!=last?['h','Carried forward']:r.x.paid>0?['h','Partly paid']:['u','Unpaid'],
years=[...new Set(rows.map(yr))].sort().reverse(),
amt=r=>bill?r.x.amt:r.x.val;
CR=()=>{const q=(F.q||'').trim().toLowerCase();let a=rows.filter(r=>(!bill||F.st=='all'||sk(r)==F.st)&&(F.yr=='all'||yr(r)==F.yr)&&(!q||lbl(r.c).toLowerCase().includes(q)));
const so=F.so;a=a.slice();STL={m,bill,rows,a,F,stl,pays};if(so=='new')a.reverse();else if(so=='amt')a.sort((x,y)=>amt(y)-amt(x));else if(so=='due'&&bill)a.sort((x,y)=>y.bal-x.bal);else if(so=='units')a.sort((x,y)=>y.x.u-x.x.u);
const tb=a.reduce((t,r)=>t+amt(r),0),tp=a.reduce((t,r)=>t+(bill?r.x.paid:0),0);
return`<p class="mu" style="margin:10px 0 0">${a.length} cycle${a.length==1?'':'s'}${a.length?' · '+(bill?'Billed ':'Amount ')+$$(tb)+(bill?' · Paid '+$$(tp):''):''}</p>`+(a.length?a.map(r=>{const st=stl(r);return`<div class="li" onclick="rcid='${r.c.id}';go()"><b>${lbl(r.c)}</b><span style="text-align:right">${bill?`<span class="st ${st[0]}">${st[1]}</span>`:`<b>${$$(r.x.val)}</b>`} ›</span></div>`}).join(''):'<p class="mu">No cycles match</p>')};
const chips=bill?`<div class="row">${[['all','All'],['unpaid','Unpaid'],['partly','Partly paid'],['paid','Paid']].map(c=>`<button class="${F.st==c[0]?'':'g'}" onclick="cfs('st','${c[0]}')">${c[1]}</button>`).join('')}</div>`:'';
const so=[['new','Newest first'],['old','Oldest first'],['amt','Amount: high → low'],...(bill?[['due','Balance due: high → low']]:[]),['units','Units: high → low']];
return`<section class="card"><h3>Cycles</h3>${chips}<div class="grid" style="margin-top:10px"><label>Year<select onchange="cfs('yr',this.value)"><option value="all">All years</option>${years.map(y=>`<option ${F.yr==y?'selected':''}>${y}</option>`).join('')}</select></label><label>Sort<select onchange="cfs('so',this.value)">${so.map(o=>`<option value="${o[0]}" ${F.so==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label></div><label style="margin-top:10px">Search<input type="search" placeholder="e.g. Sep" value="${e(F.q||'')}" oninput="cfq(this.value)"></label><div class="row" style="margin-top:10px"><button class="g" onclick="stPdf('c')">Cycles PDF</button>${bill?`<button class="g" onclick="stPdf('l')">Ledger PDF</button><button onclick="stPdf('b')">Dono ek PDF</button>`:''}</div><div id="cl">${CR()}</div></section>`};
let bb=0;const lr=[];rows.forEach(r=>{bb+=r.x.amt;lr.push([lbl(r.c),'Bill',$$(r.x.amt),'',$$(bb)]);pays(r.c).forEach(p=>{bb-=+p.a;lr.push([p.d?dmy(p.d):lbl(r.c),'Payment'+(p.m?' · '+({cash:'Cash',upi:'UPI',bank:'Bank'}[p.m]||e(p.m)):''),'',$$(p.a),$$(bb)])})});
return`<div class="bar"><button class="g" onclick="mid=null;go()">‹ Back</button><h2>${e(m.name)}</h2><span></span></div><section class="card"><div class="kp">${kp('Type',TY[m.type][1])}${kp('Account',e(ac?ac.name:'—'))}${kp('Meter no.',e(m.no)||'—')}${kp('Mobile',e(m.phone)||'—')}</div><div class="row"><button class="g" onclick="meterForm(S.meters.find(x=>x.id=='${m.id}'))">Edit</button><button class="g" onclick="toggleOff('${m.id}')">${m.off?'Mark active':'Mark inactive (left)'}</button><button class="g" onclick="delMeter('${m.id}')">Delete</button>${m.phone?`<a href="tel:${e(m.phone)}"><button class="g">Call</button></a>`:''}</div></section>
${L.length?`<section class="card"><h3>Totals · ${L.length} cycle${L.length>1?'s':''}</h3><div class="kp">${kp('Total units',f(TU))}${bill?kp('Total billed',$$(TB))+kp('Total paid',$$(TP))+kp(run>0.5?'Balance due':'Advance / clear',`<span class="${run>0.5?'w':'ok'}">${$$(Math.abs(run))}</span>`):kp('Total amount',$$(TB))+kp('Average / cycle',f(TU/L.length))+kp('Highest cycle',f(mx))}</div><div class="ch">${rows.map(r=>`<div class="cl"><div class="b" style="height:${r.x.u/mx*100}px"><span style="height:100%"></span></div><small>${lbl(r.c).split(' ')[0]}</small></div>`).join('')}</div></section>`:'<section class="card"><p class="mu">No readings yet for this meter.</p></section>'}
${cyc()}${bill&&L.length?`<section class="card sc"><h3>Ledger</h3><table><tr><th>Date / cycle</th><th>Entry</th><th>Debit</th><th>Credit</th><th>Balance</th></tr>${lr.map(q=>`<tr>${q.map(z=>`<td>${z}</td>`).join('')}</tr>`).join('')}</table></section>`:''}`}
function payX(ci,mi){ask('Add payment',[{k:'a',l:'Amount',t:'number'},{k:'d',l:'Date',t:'date',v:new Date().toISOString().slice(0,10)},{k:'m',l:'Mode',v:'cash',o:[['cash','Cash'],['upi','UPI'],['bank','Bank transfer']]}],o=>{if(!(+o.a>0))return;const _m=S.meters.find(z=>z.id==mi),_o=_m?dues(_m).d:0;if(+o.a>_o+0.5&&!confirm('This is more than the outstanding '+$$(Math.max(0,_o))+'. The extra '+$$(+o.a-Math.max(0,_o))+' will count as advance credit. Save anyway?'))return;const c=S.cycles.find(x=>x.id==ci);c.pay=c.pay||{};(c.pay[mi]=c.pay[mi]||[]).push(o);save();go()})}
function markPaid(ci,mi){const c0=S.cycles.find(x=>x.id==ci);if(!c0)return;const d=new Date().toISOString().slice(0,10),plan=[];let credit=0;
cs().filter(y=>y.start<=c0.start).forEach(y=>{const q=calc(y).R[mi];if(!q||!q.ok||q.amt===undefined)return;const due=q.amt-q.paid;if(due<0)credit+=-due;else{const eff=Math.round((due-credit)*100)/100;if(eff>0.5){plan.push([y,eff]);credit=0}else credit=-eff}});
if(!plan.length)return;if(!confirm('Record cash payment, oldest dues first:\n'+plan.map(p=>lbl(p[0])+': '+$$(p[1])).join('\n')+'\n\nTotal: '+$$(plan.reduce((a,p)=>a+p[1],0))))return;
plan.forEach(p=>{const y=p[0];y.pay=y.pay||{};(y.pay[mi]=y.pay[mi]||[]).push({a:p[1],d,m:'cash'})});save();go()}
const PB=(mi,c)=>cs().filter(y=>y.start<c.start).reduce((t,y)=>{const q=calc(y).R[mi];return q&&q.ok&&q.amt!==undefined?t+q.amt-q.paid:t},0);
function delPay(ci,mi,i){if(confirm('Delete this payment?')){S.cycles.find(x=>x.id==ci).pay[mi].splice(i,1);save();go()}}
const pdfM=(ci,mi)=>{const o=cid;cid=ci;pdf(mi);cid=o};
S.meters=Array.isArray(S.meters)?S.meters:[];S.cycles=Array.isArray(S.cycles)?S.cycles:[];S=migrate(S);save();bkNote();
theme();go();
</script></body></html>
